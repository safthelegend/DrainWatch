# Temporary: finds which NYC Open Data evacuation-zone dataset and field answer. Deleted after one run.
name: Probe evacuation zone dataset
on:
  push:
    branches: [claude/probe-evac]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Columns and a point query
        run: |
          for id in epne-qv9x uihr-hn7s; do
            echo "=== $id columns"
            curl -sS -m 30 "https://data.cityofnewyork.us/api/views/$id/columns.json" | python3 -c "import sys,json; d=json.load(sys.stdin); print([(c.get('fieldName'), c.get('dataTypeName')) for c in d] if isinstance(d,list) else d)" || true
            echo "=== $id view"
            curl -sS -m 30 "https://data.cityofnewyork.us/api/views/$id.json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('name'), d.get('rowsUpdatedAt'), d.get('viewType'), d.get('displayType'))" || true
            for field in hurricane_ hurricane_evacuation_zone zone hurricane_evacuation_zon; do
              for geom in the_geom geometry multipolygon; do
                url="https://data.cityofnewyork.us/resource/$id.json?%24select=$field&%24where=intersects($geom,%27POINT%20(-74.01220%2040.68020)%27)&%24limit=1"
                code=$(curl -sS -m 30 -o body.txt -w "%{http_code}" "$url")
                echo "$code $id $field $geom :: $(head -c 200 body.txt)"
              done
            done
          done
          echo "=== evacuation centers search"
          curl -sS -m 30 "https://api.us.socrata.com/api/catalog/v1?domains=data.cityofnewyork.us&q=hurricane%20evacuation%20center&limit=5" | python3 -c "import sys,json; d=json.load(sys.stdin); [print(r['resource']['id'], r['resource']['name'], r['resource'].get('columns_field_name')) for r in d.get('results',[])]" || true
          echo "=== catch basin search"
          curl -sS -m 30 "https://api.us.socrata.com/api/catalog/v1?domains=data.cityofnewyork.us&q=catch%20basin&limit=8" | python3 -c "import sys,json; d=json.load(sys.stdin); [print(r['resource']['id'], r['resource']['name'], r['resource'].get('type'), r['resource'].get('columns_field_name')) for r in d.get('results',[])]" || true
